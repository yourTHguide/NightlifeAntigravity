<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>V2 Founder Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Anti-Zoom Mobile Fix */
        input,
        textarea,
        select {
            font-size: 16px !important;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p.subtitle {
            color: #94a3b8;
            margin: 0.5rem 0 0;
        }

        /* Date Manager Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        /* Calendar Widget */
        .calendar-widget {
            background: #1C1C1E;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-controls select {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
        }

        .calendar-grid-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            border: 2px solid transparent;
        }

        .calendar-day.empty {
            visibility: hidden;
        }

        .calendar-day.closed {
            background: #8E8E93;
            color: #ffffff;
        }

        .calendar-day.closed:hover {
            background: #737376;
            transform: scale(1.05);
        }

        .calendar-day.open {
            background: #FF2D95;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 45, 149, 0.3);
        }

        .calendar-day.open:hover {
            background: #e01d7e;
            transform: scale(1.05);
        }

        .calendar-day.updating {
            opacity: 0.5;
            pointer-events: none;
        }

        .calendar-day .status-text {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 0.2rem;
            opacity: 0.9;
        }

        /* Login screen */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
        }

        .login-card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #334155;
        }

        .login-card input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        .btn {
            background: #FF2D95;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover {
            background: #e01d7e;
        }

        #dashboard-view {
            display: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }

        /* Tabs */
        .dashboard-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #1e293b;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #f8fafc;
        }

        .tab-btn.active {
            color: #FF2D95;
            border-bottom-color: #FF2D95;
        }

        .tab-section {
            display: none;
        }

        .tab-section.active {
            display: block;
        }

        /* Bookings List */
        .bookings-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .booking-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .booking-card:hover {
            border-color: #475569;
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .booking-date {
            background: rgba(255, 45, 149, 0.15);
            color: #FF2D95;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .booking-details {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #334155;
            font-size: 0.875rem;
            color: #cbd5e1;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .booking-card.expanded .booking-details {
            display: flex;
        }

        .view-toggler {
            display: flex;
            background: #1e293b;
            border-radius: 0.5rem;
            padding: 0.25rem;
            border: 1px solid #334155;
        }

        .view-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 0.4rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0.375rem;
            transition: all 0.2s ease;
        }

        .view-btn.active {
            background: #334155;
            color: #f8fafc;
        }

        .booking-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            margin-left: 0.5rem;
        }

        .badge-upcoming {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .badge-today {
            background: rgba(255, 45, 149, 0.15);
            color: #FF2D95;
        }

        .badge-completed {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }

        .crm-dot {
            width: 6px;
            height: 6px;
            background: #FF2D95;
            border-radius: 50%;
            margin-top: 0.25rem;
            box-shadow: 0 0 5px rgba(255, 45, 149, 0.6);
        }

        /* Mobile Responsiveness Rules */
        @media (max-width: 768px) {
            .section-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 1rem;
            }

            .section-header>div {
                flex-wrap: wrap;
                width: 100%;
                justify-content: space-between;
            }

            .calendar-widget {
                padding: 1rem;
            }

            .calendar-grid {
                gap: 4px;
            }

            .calendar-grid-header {
                font-size: 0.75rem;
            }

            .calendar-day {
                font-size: 0.9rem;
            }

            .calendar-day .status-text {
                font-size: 0.55rem;
            }

            .calendar-controls select {
                padding: 0.5rem;
                font-size: 0.9rem;
            }

            /* Wrapping booking details dynamically on mobile */
            .booking-details>div {
                flex-direction: column;
                gap: 0.5rem;
            }

            /* Giving WhatsApp and Email full width on very small screens so they don't crush */
            .booking-details>div>span {
                width: 100%;
                word-wrap: break-word;
                white-space: normal;
                display: block;
            }

            .edit-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            .edit-actions {
                display: flex;
                justify-content: flex-end;
                gap: 1rem;
                align-items: center;
            }

            @media (max-width: 600px) {
                .edit-grid {
                    grid-template-columns: 1fr !important;
                    gap: 1.25rem !important;
                }

                .edit-actions {
                    flex-direction: column-reverse;
                    align-items: stretch !important;
                }

                .edit-actions button {
                    width: 100%;
                }

                .edit-actions button:first-child {
                    margin-right: 0 !important;
                }
            }
        }
    </style>
</head>

<body>

    <!-- Login -->
    <div id="login-view" class="login-screen">
        <div class="login-card">
            <h2>V2 Control Panel</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required autocomplete="email">
                <input type="password" id="login-password" placeholder="Password" required>
                <div id="login-error" style="color: #fb7185; margin-bottom: 1rem; display: none;"></div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view">
        <div class="container">
            <header>
                <h1>V2 Founder Dashboard</h1>
                <p class="subtitle">Lightweight control panel for date availability</p>
                <button id="btn-logout" type="button"
                    style="background:none; border:none; color:#FF2D95; cursor:pointer; padding:0; margin-top:0.5rem">Logout</button>
            </header>

            <!-- Menu Tabs -->
            <div class="dashboard-tabs">
                <button class="tab-btn active" type="button" data-tab="availability">Availability</button>
                <button class="tab-btn" type="button" data-tab="bookings">Bookings List (CRM)</button>
            </div>

            <!-- Tab: Availability -->
            <section id="tab-availability" class="tab-section active">
                <div class="section-header">
                    <h2 class="section-title">Date Manager (Visual Calendar)</h2>
                    <button id="btn-refresh" class="btn" type="button"
                        style="width: auto; padding: 0.5rem 1rem; background: #334155;">Refresh</button>
                </div>

                <div id="dates-loading" class="loading">Loading dates...</div>

                <div id="calendar-widget" class="calendar-widget" style="display: none;">
                    <div class="calendar-controls">
                        <select id="admin-cal-month"></select>
                        <select id="admin-cal-year"></select>
                    </div>
                    <div class="calendar-grid-header">
                        <div>SUN</div>
                        <div>MON</div>
                        <div>TUE</div>
                        <div>WED</div>
                        <div>THU</div>
                        <div>FRI</div>
                        <div>SAT</div>
                    </div>
                    <div id="admin-cal-grid" class="calendar-grid">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </section>

            <!-- Tab: Bookings List -->
            <section id="tab-bookings" class="tab-section">
                <div class="section-header" style="align-items: center;">
                    <h2 class="section-title">Bookings List (Paid)</h2>
                    <div style="display:flex; gap:1rem; align-items:center;">
                        <!-- View Toggle -->
                        <div class="view-toggler">
                            <button id="view-list-btn" class="view-btn active" type="button">List</button>
                            <button id="view-cal-btn" class="view-btn" type="button">Calendar</button>
                        </div>
                        <button id="btn-refresh-bookings" class="btn" type="button"
                            style="width: auto; padding: 0.4rem 1rem; background: #334155;">Refresh</button>
                    </div>
                </div>

                <!-- List View Container -->
                <div id="bookings-list-container" class="bookings-grid">
                    <div class="loading">Loading bookings...</div>
                </div>

                <!-- Calendar View Container -->
                <div id="bookings-calendar-container" class="calendar-widget" style="display:none;">
                    <div class="calendar-controls">
                        <select id="crm-cal-month"></select>
                        <select id="crm-cal-year"></select>
                    </div>
                    <div class="calendar-grid-header">
                        <div>SUN</div>
                        <div>MON</div>
                        <div>TUE</div>
                        <div>WED</div>
                        <div>THU</div>
                        <div>FRI</div>
                        <div>SAT</div>
                    </div>
                    <div id="crm-cal-grid" class="calendar-grid">
                        <!-- Rendered via JS -->
                    </div>
                </div>

                <!-- Shared target for clicking a date in Calendar View -->
                <div id="bookings-calendar-cards" class="bookings-grid" style="display:none; margin-top: 1.5rem;"></div>

            </section>
        </div>
    </div>

    <script src="/js/admin-v2.js"></script>
</body>

</html>
